server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    server_tokens off;

    # Seguridad básica para un sitio estático
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; base-uri 'self'; form-action 'self'" always;

    # Compresión
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Estáticos: cache corta (el HTML manda)
    location ~* \.(?:css|js)$ {
        expires 1h;
        access_log off;
    }

    # El HTML siempre revalidado, para que un deploy se vea al instante
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Salud para el HEALTHCHECK / balanceadores
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
